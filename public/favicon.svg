<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tfAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tfGrad)" />
  <!-- Precision Target Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#tfAccent)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="32" cy="32" r="13" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <!-- Crosshairs / Molecular Bonds -->
  <line x1="32" y1="6" x2="32" y2="15" stroke="url(#tfAccent)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="49" x2="32" y2="58" stroke="url(#tfAccent)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="6" y1="32" x2="15" y2="32" stroke="url(#tfAccent)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="49" y1="32" x2="58" y2="32" stroke="url(#tfAccent)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Central Forge Atom Core -->
  <circle cx="32" cy="32" r="5" fill="url(#tfAccent)" />
